name: Stock screen

# Every US-listed company worth $300M+ scored on quality, value, momentum and dilution within its
# sector, plus the growing-backlog screen. Writes screen.json to the journal-data branch.
on:
  schedule:
    - cron: "43 6 * * 0"      # Sundays, before the weekly recap
  workflow_dispatch:
  pull_request:
    paths:
      - market_tracker/screen.py
      - .github/workflows/screen.yml

permissions:
  contents: write

concurrency:
  group: journal-data-branch   # shared with the other jobs that push to journal-data
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Screen
        run: |
          mkdir -p "$RUNNER_TEMP/screen"
          mt screen --out "$RUNNER_TEMP/screen/screen.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to journal-data branch
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin journal-data:refs/remotes/origin/journal-data; then
            git checkout -B journal-data origin/journal-data
          else
            git checkout --orphan journal-data
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP/screen/screen.json" .
          git add screen.json
          git commit -qm "Stock screen $(date -u +%F)" || { echo "No changes"; exit 0; }
          git push origin journal-data
