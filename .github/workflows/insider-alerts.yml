name: Insider alerts

# Scans every company's Form 4 filings from the SEC daily index for open-market purchases
# and opens a GitHub issue (which GitHub emails to watchers) when several insiders at one
# company buy within 30 days. State lives on the journal-data branch next to the journal.
on:
  schedule:
    - cron: "30 10 * * *"   # after the SEC publishes the previous day's index
  workflow_dispatch:
    inputs:
      backfill_days:
        description: Rescan this many calendar days (about a minute per business day)
        default: "0"
  pull_request:
    paths:
      - market_tracker/alerts.py
      - .github/workflows/insider-alerts.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: journal-data-branch   # shared with journal.yml: both push to journal-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Load alert state
        run: |
          mkdir -p "$RUNNER_TEMP/alerts"
          if git fetch --depth=1 origin journal-data:refs/remotes/origin/journal-data; then
            for f in insider_buys.csv alerted.csv alerts_state.json; do
              git show "origin/journal-data:$f" > "$RUNNER_TEMP/alerts/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/alerts/$f"
            done
          fi
      - name: Scan filings
        env:
          BACKFILL: ${{ inputs.backfill_days || '0' }}
        run: |
          args=(--data-dir "$RUNNER_TEMP/alerts" --issues-dir "$RUNNER_TEMP/issues")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run --days 4); fi
          if [ "$BACKFILL" != "0" ]; then args+=(--days "$BACKFILL"); fi
          mt alerts "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open issues for new clusters
        if: env.DRY_RUN != 'true'
        run: |
          shopt -s nullglob
          gh label create insider-alert --color 2743D6 --description "Insider cluster buy" --force
          for body in "$RUNNER_TEMP"/issues/*.md; do
            gh issue create --title "$(cat "${body%.md}.title")" --body-file "$body" --label insider-alert
          done
      - name: Save state to journal-data branch
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify -q refs/remotes/origin/journal-data >/dev/null; then
            git checkout -B journal-data origin/journal-data
          else
            git checkout --orphan journal-data
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP"/alerts/*.csv "$RUNNER_TEMP"/alerts/*.json .
          git add insider_buys.csv alerted.csv alerts_state.json
          git commit -qm "Insider alerts $(date -u +%F)" || { echo "No changes"; exit 0; }
          git push origin journal-data
