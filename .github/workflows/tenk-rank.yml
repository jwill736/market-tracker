name: 10-K ranking

# Every S&P 500 company's latest annual report against the year before: how much of Risk
# Factors is new. Only companies with a new 10-K since the last run are re-read, so after the
# first run this takes minutes. The app reads tenk_rank.json from the journal-data branch.
on:
  schedule:
    - cron: "17 7 * * 0"      # Sundays, before the weekly recap
  workflow_dispatch:
    inputs:
      limit:
        description: Only the first N companies (0 = all)
        default: "0"
  pull_request:
    paths:
      - market_tracker/tenkrank.py
      - .github/workflows/tenk-rank.yml

permissions:
  contents: write

concurrency:
  group: journal-data-branch   # shared with the other jobs that push to journal-data
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Load last ranking
        run: |
          mkdir -p "$RUNNER_TEMP/rank"
          if git fetch --depth=1 origin journal-data:refs/remotes/origin/journal-data; then
            git show origin/journal-data:tenk_rank.json > "$RUNNER_TEMP/rank/prev.json" 2>/dev/null || rm -f "$RUNNER_TEMP/rank/prev.json"
          fi
      - name: Rank
        env:
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          args=(--out "$RUNNER_TEMP/rank/tenk_rank.json" --previous "$RUNNER_TEMP/rank/prev.json" --budget-minutes 270)
          if [ "$DRY_RUN" = "true" ]; then args+=(--limit 5); elif [ "$LIMIT" != "0" ]; then args+=(--limit "$LIMIT"); fi
          mt tenk-rank "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to journal-data branch
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify -q refs/remotes/origin/journal-data >/dev/null; then
            git checkout -B journal-data origin/journal-data
          else
            git checkout --orphan journal-data
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP/rank/tenk_rank.json" .
          git add tenk_rank.json
          git commit -qm "10-K ranking $(date -u +%F)" || { echo "No changes"; exit 0; }
          git push origin journal-data
