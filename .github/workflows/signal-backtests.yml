name: Signal backtests

# Replays the two signals behind the sleepers and spin-off lists on history: opportunistic insider
# buying since 2013 (SEC Form 3/4/5 data sets) and every spin-off registration since 2005. Writes
# insider_backtest.json and spinoff_backtest.json to journal-data; the app shows them next to the
# lists. Monthly, on demand, and a quick spin-off check when the code changes.
on:
  schedule:
    - cron: "37 8 3 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - market_tracker/insider_backtest.py
      - market_tracker/spinoff_backtest.py
      - .github/workflows/signal-backtests.yml

permissions:
  contents: write

concurrency:
  group: journal-data-branch   # shared with the other jobs that push to journal-data
  cancel-in-progress: false

jobs:
  backtests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Spin-offs
        run: |
          mkdir -p "$RUNNER_TEMP/bt"
          mt spinoff-backtest --out "$RUNNER_TEMP/bt/spinoff_backtest.json" ${{ github.event_name == 'pull_request' && '--first-year 2022' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Insider buying
        if: env.DRY_RUN != 'true'
        run: mt insider-backtest --out "$RUNNER_TEMP/bt/insider_backtest.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to journal-data branch
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin journal-data:refs/remotes/origin/journal-data; then
            git checkout -B journal-data origin/journal-data
          else
            git checkout --orphan journal-data
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP/bt/"*.json .
          git add spinoff_backtest.json insider_backtest.json
          git commit -qm "Signal backtests $(date -u +%F)" || { echo "No changes"; exit 0; }
          git push origin journal-data
