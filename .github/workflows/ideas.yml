name: Idea log

# Each weekday after the US close: the screens' ideas (quality/value/momentum, backlogs, sleepers,
# chatter, raised guidance, spin-offs) are priced at the close, added to ideas_log.jsonl on the
# journal-data branch, and the day is sealed into ideas_chain.jsonl (SHA-256, chained). The app
# imports the log and scores every idea against VOO, so the record grows even when the app is off.
on:
  schedule:
    - cron: "25 21 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - market_tracker/ideas.py
      - market_tracker/idealab.py
      - .github/workflows/ideas.yml

permissions:
  contents: write

concurrency:
  group: journal-data-branch   # shared with the other jobs that push to journal-data
  cancel-in-progress: false

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Current log
        run: |
          mkdir -p "$RUNNER_TEMP/ideas"
          if git fetch --depth=1 origin journal-data:refs/remotes/origin/journal-data; then
            for f in ideas_log.jsonl ideas_chain.jsonl; do
              git show "origin/journal-data:$f" > "$RUNNER_TEMP/ideas/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/ideas/$f"
            done
          fi
      - name: Log today's ideas
        run: mt ideas-log --dir "$RUNNER_TEMP/ideas" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to journal-data branch
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin journal-data:refs/remotes/origin/journal-data; then
            git checkout -B journal-data origin/journal-data
          else
            git checkout --orphan journal-data
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP/ideas/ideas_log.jsonl" "$RUNNER_TEMP/ideas/ideas_chain.jsonl" .
          git add ideas_log.jsonl ideas_chain.jsonl
          git commit -qm "Idea log $(date -u +%F)" || { echo "No changes"; exit 0; }
          git push origin journal-data
