[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-tracker"
version = "0.1.0"
description = "Portfolio tracker with smart-money (13F / insider) signals, news sentiment, probabilistic forecasts and Claude-powered deep-dive research for stocks and crypto."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "websockets>=13",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
mt = "market_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["market_tracker*"]

[tool.setuptools.package-data]
market_tracker = ["static/*", "site_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
